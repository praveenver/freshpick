<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fresh Pick</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Fredoka:wght@500;600&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<style>
:root{--g:#06382C;--d:#1F2A24;--k:#1F2A24;--bg:#FFF4EA;--t:#1F2A24;--m:#7A6F66;--w:#fff;--ln:#F0E2D3;--gl:#E8F5D8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--g);z-index:30}
button{font-family:inherit;cursor:pointer;border:0}
input,select{font-family:inherit;font-size:15px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--g);padding:10px 16px 16px;border-radius:0 0 22px 22px}
.hero{background:var(--g);color:#fff;padding:18px 16px 10px}.top{display:flex;align-items:center;gap:8px}.hero h1{margin:18px 0 4px;font-family:'Comic Neue','Comic Sans MS',cursive;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:0}.hero p{margin:0;font-size:14px;opacity:.85}
.logo{width:84px;height:auto;display:block;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.brand{font-family:'Fredoka','Trebuchet MS',sans-serif;font-weight:600;font-size:28px;line-height:1.2;letter-spacing:0;flex:1;color:#39FF14;margin-left:-4px}

.cartb{position:relative;background:rgba(255,255,255,.15);color:#fff;width:42px;height:42px;border-radius:13px;font-size:19px}
.cartb b{position:absolute;top:-5px;right:-5px;background:#9BF05C;color:var(--g);font-size:11px;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center}
.srch{margin-top:0;width:100%;padding:11px 14px;border:0;border-radius:12px;background:#fff;outline:0}
.srch:focus{border-color:var(--d)}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chip{padding:8px 16px;border-radius:20px;background:transparent;color:#fff;font-weight:600;font-size:13px;white-space:nowrap;border:1.5px solid rgba(255,255,255,.45)}
.chip.on{background:#fff;border-color:#fff;color:var(--g)}
.trust{display:flex;justify-content:space-between;gap:6px;padding:10px 16px;font-size:11.5px;color:var(--m);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 14px}
.card{background:var(--w);border-radius:18px;padding:10px;border:1px solid var(--ln);display:flex;flex-direction:column;position:relative}
.im{aspect-ratio:1.35;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:46px;overflow:hidden}
.im img{width:100%;height:100%;object-fit:cover}
.nm{font-weight:700;font-size:15px;margin-top:8px}
.mk{font-size:12px;color:var(--m);text-decoration:line-through}
.pr{font-weight:700;font-size:18px;color:var(--k);line-height:1.2}
.pr small{font-size:12px;font-weight:500;color:var(--m)}
.sv{display:inline-block;align-self:flex-start;margin:4px 0 8px;background:var(--gl);color:var(--d);font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px}
.add{margin-top:auto;width:100%;padding:10px;border-radius:10px;background:var(--g);color:#fff;font-weight:800;font-size:14px;transition:transform .12s}
.add:active{transform:scale(.95)}
.add[disabled]{background:#E5E9E4;color:#8a948c}
.step{margin-top:auto;display:flex;align-items:center;justify-content:space-between;background:var(--g);border-radius:10px;padding:3px}
.step button{width:40px;height:38px;border-radius:8px;background:transparent;color:#fff;font-size:20px;font-weight:800}
.step span{color:#fff;font-weight:700;font-size:14px}
.edb{position:absolute;top:6px;right:6px;background:var(--g);color:#fff;width:32px;height:32px;border-radius:10px}.edb2{right:44px}.lnk{background:none;color:var(--m);font-size:12px;text-decoration:underline}.cta[disabled]{background:#D4D5D9;color:#fff;box-shadow:none}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.bar button{width:100%;max-width:452px;background:var(--g);color:#fff;border-radius:16px;padding:13px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px;box-shadow:0 6px 18px rgba(6,56,44,.3);animation:pop .25s}
.bar small{display:block;font-weight:600;font-size:11px}
@keyframes pop{from{transform:translateY(20px);opacity:0}}
.pg{padding:14px}
.h2{font-weight:800;font-size:22px;margin:4px 0 12px;display:flex;align-items:center;gap:8px}
.back{background:var(--w);border:1px solid var(--ln);border-radius:12px;width:38px;height:38px;font-size:18px}
.row{display:flex;gap:12px;align-items:center;background:var(--w);border:1px solid var(--ln);border-radius:16px;padding:10px;margin-bottom:10px}
.row .im{width:62px;aspect-ratio:1;font-size:30px;flex:none}
.row .info{flex:1;min-width:0}
.row .step{width:112px;margin:0}
.row .step button{width:32px;height:32px}
.box{background:var(--w);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.ln{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}
.ln.sv2{color:var(--d);font-weight:700}
.ln.tt{border-top:1.5px dashed var(--ln);margin-top:6px;padding-top:10px;font-weight:800;font-size:18px}
.prog{height:8px;background:var(--ln);border-radius:5px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--g);border-radius:5px;transition:width .3s}
.cta{width:100%;padding:15px;border-radius:12px;background:var(--g);color:#fff;font-weight:800;font-size:16px;box-shadow:0 6px 18px rgba(6,56,44,.25)}
.cta.dk{background:var(--g);color:#fff;box-shadow:none}
.qr{width:220px;height:220px;margin:8px auto;border-radius:16px;border:2px dashed var(--d);display:grid;place-items:center;text-align:center;color:var(--m);font-size:12px;padding:10px;overflow:hidden}
.qr img{width:100%;height:100%;object-fit:contain}
.warn{background:var(--gl);color:var(--t);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin:10px 0}
.fi{width:100%;padding:12px 14px;border:1.5px solid var(--ln);border-radius:12px;margin-bottom:10px;background:var(--bg);outline:0}
.fi:focus{border-color:var(--d)}
.lb{font-size:12px;font-weight:600;color:var(--m);margin:0 0 4px 2px;display:block}
.ok{width:96px;height:96px;border-radius:50%;background:var(--gl);display:grid;place-items:center;font-size:48px;margin:30px auto 16px;animation:pop .5s}
.adm{background:var(--g);color:#fff;font-size:12px;padding:8px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.adm b{color:#fff;flex:1}
.adm button{background:#fff;color:var(--t);border-radius:8px;padding:6px 10px;font-weight:700;font-size:12px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(15,40,25,.55);display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--w);width:100%;max-width:480px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--m);padding:40px 20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function tot(){let a=0,m=0,n=0,k=0;for(const i in C){const p=gp(i);if(!p){if(loaded)delete C[i];continue}a+=p.p*C[i];m+=p.m*C[i];k+=C[i];n++}const d=a>=S.fr||!n?0:S.dl;return{a,m,n,k,d,sv:m-a,f:a+d}}

window.addEventListener('popstate',e=>{closeM();let v=(e.state&&e.state.v)||'home';if(v!='home'&&!tot().n)v='home';view=v;render()});
history.replaceState({v:'home'},'');

function img(p){return p.img?`<img src="${p.img}" alt="${p.n}">`:p.e}

function cardH(p){
  const q=C[p.id]||0;
  let act=!p.s?`<button class="add" disabled>Out of stock</button>`:q?`<div class="step"><button data-a="dec" data-i="${p.id}">−</button><span>${fq(q)}</span><button data-a="inc" data-i="${p.id}">+</button></div>`:`<button class="add" data-a="inc" data-i="${p.id}">ADD</button>`;
  return `<div class="card"><div class="im">${img(p)}</div>${admin?`<button class="edb edb2" data-a="del" data-i="${p.id}">🗑️</button><button class="edb" data-a="edit" data-i="${p.id}">✏️</button>`:''}<div class="nm">${p.n}</div><div class="mk">Market ${R(p.m)}/kg</div><div class="pr">${R(p.p)}<small>/kg</small></div><div class="sv">You save ${R(p.m-p.p)}/kg</div>${act}</div>`;
}
function gridH(){
  const l=P.filter(p=>(cat=='all'||p.c==cat)&&p.n.toLowerCase().includes(q.toLowerCase()));
  return l.length?l.map(cardH).join(''):`<div class="empty" style="grid-column:1/3">${loaded?(err?'Connection error. Page refresh karo.':'Koi item nahi mila.'):'Loading…'}</div>`;
}

function bar(){
  const t=tot();
  $('#bar').innerHTML=view=='home'&&t.n?`<div class="bar"><button data-a="cart"><span>${t.n} item${t.n>1?'s':''} · ${R(t.a)}<small>${t.k<S.mn?'Min '+S.mn+'kg order · '+fq(S.mn-t.k)+' aur chahiye':'You save '+R(t.sv)+' vs market'}</small></span><span>View cart →</span></button></div>`:'';
}

let waUrl='';
function confirmO(){
  const n=$('#fn').value.trim(),p=$('#fp').value.trim(),ad=$('#fa').value.trim();
  S.name=n;S.ph=p;S.ad=ad;save();
  if(tot().k<S.mn){alert('Minimum order '+S.mn+'kg hai.');return}
  if(n.length<2||!/^\d{10}$/.test(p)||ad.length<5){alert('Naam, 10 digit mobile number aur poora address bharo.');return}
  const t=tot();
  const lines=Object.keys(C).map(i=>{const x=gp(i);return `• ${x.n} – ${fq(C[i])} – ${R(x.p*C[i])}`});
  const msg=`🛒 *New Order – Fresh Pick*\n\n👤 ${n}\n📞 ${p}\n📍 ${ad}\n\n${lines.join('\n')}\n\nItems: ${R(t.a)}\nDelivery: ${t.d?R(t.d):'FREE'}\n*Total: ${R(t.f)}*\n\n✅ Payment screenshot is chat mein attach kar raha/rahi hoon.`;
  try{sb.from('orders').insert({name:n,phone:p,address:ad,items:lines,total:t.f}).then(()=>{},()=>{})}catch(e){}
  waUrl=`https://wa.me/${S.wa}?text=${encodeURIComponent(msg)}`;
  openWA();
  view='done';history.replaceState({v:'done'},'');render();
}
function openWA(){const w=window.open(waUrl,'_blank');if(!w)location.href=waUrl}

/* ===== Admin ===== */
let lp;
function bindLogo(){
  const l=$('#logo');if(!l)return;
  const st=()=>{lp=setTimeout(pinM,800)},en=()=>clearTimeout(lp);
  l.addEventListener('touchstart',st,{passive:true});l.addEventListener('touchend',en);l.addEventListener('mousedown',st);l.addEventListener('mouseup',en);l.addEventListener('mouseleave',en);
}
function modal(h){$('#modal').innerHTML=`<div class="ov" data-a="x"><div class="sh" id="sh">${h}</div></div>`}
function closeM(){$('#modal').innerHTML='';pend=null}
function pinM(){modal(`<div class="h2">Admin login</div><input class="fi" id="ae" type="email" placeholder="Email" autocomplete="username"><input class="fi" id="ap" type="password" placeholder="Password" autocomplete="current-password"><button class="cta" data-a="login">Login</button>`)}
function editM(id){
  const p=id?gp(id):{n:'',e:'🥬',c:'s',m:0,p:0,s:1,img:''};pend=p.img;
  modal(`<div class="h2">${id?'Edit item':'New item'}</div><div class="two"><div><label class="lb">Name</label><input class="fi" id="en" value="${p.n}"></div><div><label class="lb">Emoji</label><input class="fi" id="ee" value="${p.e}"></div><div><label class="lb">Market rate ₹/kg</label><input class="fi" id="em" type="number" value="${p.m}"></div><div><label class="lb">Fresh Pick rate ₹/kg</label><input class="fi" id="ep" type="number" value="${p.p}"></div></div><label class="lb">Category</label><select class="fi" id="ec"><option value="s" ${p.c=='s'?'selected':''}>Sabzi</option><option value="f" ${p.c=='f'?'selected':''}>Fruit</option></select><label class="lb">Photo (gallery se)</label><input class="fi" id="ei" type="file" accept="image/*"><label style="display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:14px"><input type="checkbox" id="es" ${p.s?'checked':''}> In stock</label><button class="cta" data-a="saveitem" data-i="${id||''}">Save</button>${id?`<button class="cta dk" style="margin-top:10px" data-a="delitem" data-i="${id}">Delete item</button>`:''}`);
}
function setM(){modal(`<div class="h2">Settings</div><label class="lb">WhatsApp number (91 ke saath, bina +)</label><input class="fi" id="sw" value="${S.wa}" inputmode="numeric"><label class="lb">Payment QR image</label><input class="fi" id="sq" type="file" accept="image/*"><div class="two"><div><label class="lb">Delivery charge ₹</label><input class="fi" id="sd" type="number" value="${S.dl}"></div><div><label class="lb">Free delivery above ₹</label><input class="fi" id="sf" type="number" value="${S.fr}"></div></div><label class="lb">Minimum order (kg)</label><input class="fi" id="sm" type="number" value="${S.mn}"><button class="cta" data-a="saveset">Save settings</button><button class="cta dk" style="margin-top:10px" data-a="reset">Add sample items</button>`)}
function shrink(f,max,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};i.src=r.result};r.readAsDataURL(f)}
let newQR=null;
document.addEventListener('change',e=>{
  const t=e.target;if(!t.files||!t.files[0])return;
  if(t.id=='ei')shrink(t.files[0],420,d=>pend=d);
  if(t.id=='sq')shrink(t.files[0],700,d=>newQR=d);
});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;$('#grid').innerHTML=gridH()}});

/* ===== Database (Supabase) ===== */
const ck=r=>{if(r.error)throw r.error;return r};
async function load(){try{const a=ck(await sb.from('products').select('*').order('pos').order('id'));P=a.data;const r=await sb.from('settings').select('*').eq('id',1).maybeSingle();const d=r.data;if(d)Object.assign(S,{wa:d.wa||S.wa,qr:d.qr||'',dl:d.dl??S.dl,fr:d.fr??S.fr,mn:d.mn??S.mn});err=0}catch(e){err=1}loaded=1;render()}
async function up(d,n){const b=await (await fetch(d)).blob();const f=n+'-'+Date.now()+'.jpg';ck(await sb.storage.from('media').upload(f,b,{contentType:'image/jpeg'}));return sb.storage.from('media').getPublicUrl(f).data.publicUrl}
async function dbSave(i,o){try{if(o.img&&o.img.startsWith('data:'))o.img=await up(o.img,'p');if(i)ck(await sb.from('products').update(o).eq('id',i));else ck(await sb.from('products').insert(Object.assign({pos:P.length},o)))}catch(e){alert('Save nahi hua. Admin login check karo.')}load()}
async function dbDel(i){P=P.filter(p=>p.id!=i);try{ck(await sb.from('products').delete().eq('id',i))}catch(e){alert('Delete nahi hua. Admin login check karo.')}load()}
async function dbSet(){try{if(newQR)S.qr=await up(newQR,'qr');ck(await sb.from('settings').upsert({id:1,wa:S.wa,qr:S.qr,dl:S.dl,fr:S.fr,mn:S.mn}));save()}catch(e){alert('Settings save nahi hui. Admin login check karo.')}load()}
async function seed(){try{ck(await sb.from('products').insert(D.map((x,i)=>({n:x[0],e:x[1],c:x[2],m:x[3],p:x[4],s:1,img:'',pos:i}))))}catch(e){alert('Pehle admin login karo.')}load()}
async function doLogin(){const r=await sb.auth.signInWithPassword({email:$('#ae').value.trim(),password:$('#ap').value});if(r.error){alert('Email ya password galat hai.');return}admin=true;closeM();render()}

/* ===== Actions ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  if(t.dataset.a=='x'&&e.target!==t)return;
  const a=t.dataset.a,i=t.dataset.i;
  if(a=='inc'){C[i]=(C[i]||0)+.5;save();render()}
  else if(a=='dec'){C[i]=(C[i]||0)-.5;if(C[i]<=0)delete C[i];save();if(view=='cart'&&!tot().n){history.back();return}render()}
  else if(a=='cat'){cat=i;render()}
  else if(a=='cart')go('cart');
  else if(a=='back')history.back();
  else if(a=='pay'){if(tot().k<S.mn)alert('Minimum order '+S.mn+'kg hai.');else go('pay')}
  else if(a=='confirm')confirmO();
  else if(a=='wa')openWA();
  else if(a=='fresh'){C={};save();view='home';history.replaceState({v:'home'},'');render()}
  else if(a=='x')closeM();
  else if(a=='login')doLogin();
  else if(a=='exit'){admin=false;sb&&sb.auth.signOut();render()}
  else if(a=='edit')editM(i);
  else if(a=='pinm')pinM();
  else if(a=='del'){if(confirm('Is item ko delete karein?')){dbDel(i);delete C[i];save();render()}}
  else if(a=='new')editM();
  else if(a=='set'){newQR=null;setM()}
  else if(a=='saveitem'){
    const o={n:$('#en').value.trim()||'Item',e:$('#ee').value||'🥬',c:$('#ec').value,m:+$('#em').value||0,p:+$('#ep').value||0,s:$('#es').checked?1:0,img:pend||''};
    dbSave(i,o);
    save();closeM();render();
  }
  else if(a=='delitem'){if(confirm('Is item ko delete karein?')){dbDel(i);delete C[i];save();closeM();render()}}
  else if(a=='saveset'){S.wa=($('#sw').value||CFG.WA).replace(/\D/g,'');const nv=(id,d)=>{const v=parseFloat($(id).value);return isNaN(v)?d:v};S.dl=nv('#sd',S.dl);S.fr=nv('#sf',S.fr);S.mn=nv('#sm',S.mn);dbSet();closeM()}
  else if(a=='reset'){if(confirm('Sample items jodein?')){seed();closeM()}}
});
if(location.hash=='#admin')pinM();
window.addEventListener('hashchange',()=>{if(location.hash=='#admin')pinM()});
render();
load();
if(sb)sb.auth.getSession().then(r=>{if(r.data.session){admin=true;render()}});
</script>
</body>
</html>
